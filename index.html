<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRHH - Jamones Granadinos</title>
<meta name="theme-color" content="#2E2A80">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="preload" href="logo.png" as="image">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RRHH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=block" rel="stylesheet">
<style>
:root{
  /* Colores de Jamones Granadinos Baza (sacados del logo) */
  --marca-rojo:#E30A1B;
  --marca-azul:#2E2A80;
  --cal:#F4F5F9;        /* fondo */
  --papel:#FFFFFF;
  --pino:#2E2A80;       /* color principal: azul de la marca */
  --pino-2:#423DA8;
  --pino-claro:#E4E3F3;
  --azafran:#D99A1E;    /* pendiente / medio día */
  --azafran-claro:#F8EBCB;
  --grana:#B8101D;      /* rechazado / ausencias */
  --grana-claro:#FBE1E3;
  --tinta:#1B1A33;
  --pizarra:#5D5C72;
  --linea:#D7D8E3;
  --r:10px;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --texto:"Atkinson Hyperlegible", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
/* Que la app se quede quieta en el móvil: sin rebotes, sin desplazamiento lateral, sin zoom al tocar dos veces */
html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left}
body{background:var(--cal);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azafran);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700;margin-bottom:12px}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--pizarra)}
.small{font-size:15px}

/* franja de prototipo */
.demo{background:var(--tinta);color:#E8EDEA;font-size:14px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
.demo label{display:flex;gap:8px;align-items:center}
.demo input[type=date]{width:auto;min-height:0;background:#2A3430;border:1px solid #44514B;border-radius:6px;padding:3px 6px;color:#fff;color-scheme:dark}
.demo button{background:none;border:1px solid #44514B;border-radius:6px;color:#E8EDEA;padding:3px 10px;cursor:pointer}

/* cabecera */
.top{background:var(--papel);color:var(--marca-azul);border-bottom:4px solid var(--marca-rojo);box-shadow:inset 0 -7px 0 -4px var(--marca-azul)}
.top-in{max-width:980px;margin:0 auto;padding:10px 20px 13px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.marca{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:14px;color:var(--marca-azul)}
.marca img{height:46px;width:auto;display:block}
.marca svg{flex:none}
.top button{background:transparent;color:var(--marca-azul);border:1.5px solid var(--marca-azul);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:700}
.top button:hover{background:var(--pino-claro)}

main{max-width:980px;margin:0 auto;padding:28px 20px 80px}
section{margin-top:36px}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo span{font-weight:700;font-size:15px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--papel);border:1.5px solid var(--linea);border-radius:var(--r);padding:12px 14px;min-height:50px}
input:focus,select:focus,textarea:focus{border-color:var(--pino-2);outline:none;box-shadow:0 0 0 3px var(--pino-claro)}
textarea{min-height:80px;resize:vertical}
input:disabled{background:#EDEEF4;color:var(--pizarra)}
.fila{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{border:0;border-radius:var(--r);padding:13px 22px;min-height:50px;font-weight:700;cursor:pointer;background:var(--pino);color:#fff}
.btn:hover{background:var(--pino-2)}
.btn[disabled]{background:#A9B5AF;cursor:not-allowed}
.btn.sec{background:var(--papel);color:var(--pino);border:1.5px solid var(--pino)}
.btn.sec:hover{background:var(--pino-claro)}
.btn.peligro{background:var(--papel);color:var(--grana);border:1.5px solid var(--grana)}
.btn.peligro:hover{background:var(--grana-claro)}
.btn.chico{padding:8px 14px;min-height:40px;font-size:15px}
.enlace{background:none;border:0;color:var(--pino);text-decoration:underline;cursor:pointer;padding:4px 0;font-weight:700}
.enlace.rojo{color:var(--grana)}

.seg{display:inline-flex;background:var(--pino-claro);border-radius:var(--r);padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:10px 16px;cursor:pointer;font-weight:700;color:var(--pino)}
.seg button[aria-pressed=true]{background:var(--papel);box-shadow:0 1px 2px rgba(46,42,128,.25)}

.bloque{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:22px}
.aviso{border-radius:var(--r);padding:12px 14px;font-size:15px}
.aviso.ok{background:var(--pino-claro);color:var(--pino)}
.aviso.mal{background:var(--grana-claro);color:var(--grana)}
.aviso.info{background:var(--azafran-claro);color:#6B4A07}

/* acceso */
.acceso{max-width:440px;margin:40px auto 0}
.acceso h1{margin-bottom:8px}
.logo-acceso{display:block;width:220px;max-width:70%;height:auto;margin:0 0 28px}

@media (max-width:640px){.marca{gap:10px}.marca img{height:36px}.marca span{font-size:15px;line-height:1.2}}
.acceso form{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.prueba{margin-top:28px;font-size:15px}
.prueba summary{cursor:pointer;font-weight:700;color:var(--pino)}
.prueba ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.prueba li button{width:100%;text-align:left;background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.prueba li button:hover{border-color:var(--pino-2)}

/* saldo: las casillas */
.saldo-cabeza{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-end;margin-top:6px}
.cifra{font-family:var(--display);font-weight:800;font-size:clamp(54px,11vw,88px);line-height:.9;letter-spacing:-.03em;color:var(--pino)}
.cifra small{font-size:.32em;font-weight:700;letter-spacing:0;margin-left:6px}
.cifra-2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--tinta)}
.casillas{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:22px;max-width:640px}
.casilla{aspect-ratio:1;border-radius:5px;display:flex;overflow:hidden;border:1.5px solid var(--linea);background:var(--papel)}
.casilla i{flex:1;display:block}
.c-disf{background:var(--pino)}
.c-apro{background:repeating-linear-gradient(135deg,var(--pino-2) 0 3px,#7A76C4 3px 6px)}
.c-res{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--pino-claro) 4px 8px)}
.c-pend{background:var(--azafran)}
.c-libre{background:transparent}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:15px;list-style:none;padding:0}
.leyenda li{display:flex;align-items:center;gap:8px}
.leyenda b{font-variant-numeric:tabular-nums}
.muestra{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--linea);flex:none}

/* listas de periodos */
.lista{list-style:none;padding:0;margin:0;border-top:1px solid var(--linea)}
.lista>li{padding:14px 2px;border-bottom:1px solid var(--linea);display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.lista .q{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.lista .q strong{font-size:17px}
.vacio{padding:18px 0;color:var(--pizarra)}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.pend{background:var(--azafran-claro);color:#7A5208}
.chip.ok{background:var(--pino-claro);color:var(--pino)}
.chip.no{background:var(--grana-claro);color:var(--grana)}
.chip.fijo{background:var(--pino);color:#fff}
.chip.gris{background:#E8E9F0;color:var(--pizarra)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.calc{margin-top:14px;min-height:24px;font-size:16px}

/* pestañas admin */
.pestanas{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--linea);margin:22px 0 0;overflow:visible}
.pestanas button{border:0;background:none;padding:12px 16px;font-weight:700;cursor:pointer;color:var(--pizarra);white-space:nowrap;display:flex;gap:8px;align-items:center;border-radius:8px 8px 0 0}
.pestanas button[aria-selected=true]{color:var(--pino);box-shadow:inset 0 -3px 0 var(--pino)}
@media (max-width:640px){.pestanas button{padding:10px 12px;font-size:15px}}
.globo{background:var(--azafran);color:#fff;border-radius:999px;font-size:13px;min-width:22px;padding:1px 7px;text-align:center}

/* tabla empleados */
.tabla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tabla th{text-align:left;font-size:14px;color:var(--pizarra);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--linea)}
.tabla td{padding:12px 10px;border-bottom:1px solid var(--linea)}
.tabla tbody tr{cursor:pointer}
.tabla tbody tr:hover{background:var(--pino-claro)}
.tabla .num{text-align:right}
.barrita{display:inline-block;width:70px;height:8px;background:var(--pino-claro);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--pino)}

.volver{margin-bottom:12px}
.dos{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:820px){.dos{grid-template-columns:1fr 1fr}}

.mes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mes h2{margin:0;min-width:200px;text-transform:capitalize}
.plan-caja{overflow-x:auto;border:1px solid var(--linea);border-radius:12px;background:var(--papel)}
.plan{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.plan th,.plan td{padding:0;text-align:center}
.plan thead th{font-weight:700;color:var(--pizarra);padding:6px 0;min-width:25px;line-height:1.2;border-bottom:1px solid var(--linea)}
.plan thead th small{display:block;font-weight:400;font-size:12px}
.plan .nom{position:sticky;left:0;background:var(--papel);text-align:left;padding:6px 12px;white-space:nowrap;font-weight:700;border-right:1px solid var(--linea);z-index:1;min-width:120px}
.plan tbody tr+tr td{border-top:1px solid #EDEEF4}
.plan td.d{height:34px;position:relative}
.plan .fin{background:#EDEEF4}
.plan .hoy{box-shadow:inset 0 0 0 2px var(--azafran)}
.plan i{position:absolute;inset:6px 3px;border-radius:4px;display:block}
.plan i.ap{background:var(--pino)}
.plan i.pe{background:var(--azafran)}
.plan i.au{background:var(--grana)}
.plan tfoot td{border-top:2px solid var(--linea);font-weight:700;font-variant-numeric:tabular-nums;height:34px;font-size:13px;color:var(--pino)}
.plan tfoot td.fin{color:var(--pizarra);font-weight:400}
.plan i.m1{right:50%}.plan i.m2{left:50%}
.carga{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;overflow:hidden;opacity:0;transition:opacity .2s}
.cargando .carga{opacity:1}
.carga i{position:absolute;top:0;bottom:0;width:40%;background:var(--azafran);animation:carga 1s linear infinite}
@keyframes carga{from{left:-40%}to{left:100%}}
.cargando main{pointer-events:none;opacity:.7}
.espera{text-align:center;padding:80px 0;color:var(--pizarra)}
.version{text-align:center;font-size:12px;color:var(--pizarra);margin:0 0 24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--tinta);color:#fff;padding:12px 20px;border-radius:var(--r);transition:.25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.ver{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  body{font-size:16px}
  .casillas{grid-template-columns:repeat(8,1fr);gap:5px}
  .tabla .ocultable{display:none}
  .top-in{padding:14px 16px}
  main{padding:20px 16px 70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="marca"><img src="logo.png" alt="Jamones Granadinos Baza"><span>RRHH - Jamones Granadinos</span></div>
  <div id="sesion"></div>
</div></header>
<main id="app"></main>
<p class="version">Versión 2026-11-11 e</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="carga" aria-hidden="true"><i></i></div>

<script>
/* ============ Configuración ============ */
// Dirección de la aplicación web de Apps Script (Implementar > Gestionar implementaciones > URL)
const API_URL = "https://script.google.com/macros/s/AKfycbxqiRPwcIXss_mxwnSmTf57GXaRFhKrzJT8Yv-zQAd26SvF6mFqfkNKjwKzj5R7KJa9/exec";
const CLAVE_SESION = "rrhh-sesion";
// Estos valores llegan del servidor; aquí solo los iniciales
let ANIO_INICIO = 2026, DIAS_ANUALES = 22, DIAS_FIJOS = 10, PIN_PROV = "1234";
let ANIOS = [2026, 2027];
let ANIO = 2026;           // año que se está viendo

/* ============ Utilidades de fecha (siempre en UTC) ============ */
const D = s => new Date(s + "T00:00:00Z");
const ISO = d => d.toISOString().slice(0,10);
const mas = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return ISO(d); };
const DS = ["dom","lun","mar","mié","jue","vie","sáb"];
const MS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const ML = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fc = s => { const d=D(s); return `${DS[d.getUTCDay()]} ${d.getUTCDate()} ${MS[d.getUTCMonth()]}${s.slice(0,4)!=String(ANIO)?" "+s.slice(0,4):""}`; };
const fl = s => { const d=D(s); return `${d.getUTCDate()} de ${ML[d.getUTCMonth()]}`; };
const rango = (a,b) => a===b ? fc(a) : `${fc(a)} – ${fc(b)}`;
function dias(a,b){ const r=[]; for(let s=a; s<=b; s=mas(s,1)) r.push(s); return r; }
const n = x => (Math.round(x*10)/10).toLocaleString("es-ES");
const dd = x => `${n(x)} ${x===1?"día":"días"}`;

/* ============ DNI ============ */
const LETRAS = "TRWAGMYFPDXBNJZSQVHLCKE";
const conLetra = num => num + LETRAS[Number(num)%23];
function dniValido(v){
  v = v.toUpperCase().replace(/[\s-]/g,"");
  let m = v.match(/^([XYZ]?)(\d{7,8})([A-Z])$/);
  if(!m) return null;
  let num = m[2]; if(m[1]) num = "XYZ".indexOf(m[1]) + num.padStart(7,"0");
  return LETRAS[Number(num)%23] === m[3] ? v : null;
}

/* ============ Estado ============ */
let S = null;
let vista = {sesion:null, tab:"solicitudes", emp:null, tipoAus:"falta", medio:false, franja:"mañana", rechazando:null, filtroAus:"todos", sim:{}};
const emp = id => S.empleados.find(e=>e.id===id);
const activos = () => S.empleados.filter(e=>e.activo!==false);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============ Cálculo de días ============ */
const festSet = () => new Set(S.festivos.map(f=>f.fecha));
function laborables(desde,hasta){ const fs=festSet(); return dias(desde,hasta).filter(s=>{const w=D(s).getUTCDay(); return w>0&&w<6&&!fs.has(s);}); }
const valor = v => v.medio ? 0.5 : laborables(v.desde,v.hasta).length;
function partir(v){ // días disfrutados (antes de hoy) y por venir
  if(v.medio) return v.desde < S.hoy ? [0.5,0] : [0,0.5];
  const l = laborables(v.desde,v.hasta); const p = l.filter(s=>s<S.hoy).length; return [p, l.length-p];
}
// Días de un año que no se han gastado: los que no tienen vacaciones aprobadas. Pasan al año siguiente.
function sobrante(id, a){ const s=saldo(id,a); return Math.max(0, s.total - s.fijos - s.pedidos); }
const desglose = (s,a=ANIO) => {
  if(a===ANIO_INICIO) return s.extra?` (${n(s.base)} al empezar + ${n(s.extra)} extra)`:` (los que tenías al empezar con la app)`;
  const p=[`${DIAS_ANUALES} del año`]; if(s.arrastre) p.push(`${n(s.arrastre)} sin gastar de ${a-1}`); if(s.extra) p.push(`${n(s.extra)} extra`);
  return p.length>1?` (${p.join(" + ")})`:"";
};
const delAnio = (s,a=ANIO) => s.slice(0,4)===String(a);
const fijosDe = a => a===ANIO_INICIO ? 0 : DIAS_FIJOS;   // el año de arranque no lleva días fijos
function saldo(id, a=ANIO){
  const DIAS_FIJOS = fijosDe(a);
  const vs = S.vac.filter(v=>v.emp===id && anioVac(v)===a);
  const extra = S.extras.filter(x=>x.emp===id && (x.anio||2027)===a).reduce((t,x)=>t+Number(x.dias),0);
  const sinCargar = a===ANIO_INICIO && S.inicial[id]==null;
  const base = a===ANIO_INICIO ? Number(S.inicial[id]||0) : DIAS_ANUALES;
  const arrastre = a>ANIO_INICIO ? sobrante(id, a-1) : 0;   // días sin gastar del año anterior
  const total = base + extra + arrastre;
  const apro = vs.filter(v=>v.estado==="aprobada");
  const fijos = apro.filter(v=>v.origen==="admin").reduce((a,v)=>a+valor(v),0);
  const pedidos = apro.filter(v=>v.origen!=="admin").reduce((a,v)=>a+valor(v),0);
  const pend = vs.filter(v=>v.estado==="pendiente").reduce((a,v)=>a+valor(v),0);
  let disf=0, fut=0; apro.forEach(v=>{const [p,f]=partir(v); disf+=p; fut+=f;});
  const reserva = Math.max(0, DIAS_FIJOS - fijos);
  const pedir = total - Math.max(DIAS_FIJOS,fijos) - pedidos - pend;
  return {total, base, extra, arrastre, fijos, fijosObj:DIAS_FIJOS, sinCargar, pedidos, pend, disf, fut, reserva, pedir, quedan: total - disf};
}
function solapa(id, desde, hasta, excluir, franja){
  return S.vac.find(v=>v.emp===id && v.id!==excluir && v.estado!=="rechazada" && v.desde<=hasta && v.hasta>=desde && !(franja && v.medio && v.franja && v.franja!==franja));
}
const tMedio = v => "Medio día" + (v.franja?` (${v.franja})`:"");
const anioVac = v => v.anio || +v.desde.slice(0,4);   // año al que cuentan (puede ser el siguiente si son días adelantados)
function explicar(desde,hasta,medio,franja=vista.franja,anterior=false){
  // devuelve {dias, texto, error}
  if(!desde) return {dias:0,texto:""};
  if(!hasta || medio) hasta = desde;
  if(hasta<desde) return {error:"La fecha final es anterior a la inicial."};
  const ok = y => y===String(ANIO) || (anterior && y===String(ANIO-1));
  if(!ok(desde.slice(0,4))||!ok(hasta.slice(0,4))) return {error: anterior?`Las fechas tienen que ser de ${ANIO-1} o de ${ANIO}.`:`Las vacaciones tienen que estar dentro de ${ANIO}.`};
  if(desde.slice(0,4)!==hasta.slice(0,4)) return {error:"Apunta por separado los días de cada año."};
  const l = laborables(desde,hasta);
  const fs = S.festivos.filter(f=>f.fecha>=desde&&f.fecha<=hasta&&[1,2,3,4,5].includes(D(f.fecha).getUTCDay()));
  if(medio){
    if(!l.length) return {error:"Ese día no es laborable."};
    return {dias:0.5,texto:`Medio día por la ${franja} el ${fc(desde)}.`};
  }
  if(!l.length) return {error:"En esas fechas no hay ningún día laborable."};
  let t = `Son ${dd(l.length)} laborables.`;
  if(fs.length) t += ` No cuentan ${fs.map(f=>`el ${fl(f.fecha)} (${f.nombre.replace(/ \(.*\)/,"")})`).join(", ")}, ${fs.length>1?"que son festivos":"que es festivo"}.`;
  return {dias:l.length, texto:t};
}

const selAnio = () => `<div class="seg" role="group" aria-label="Año">${ANIOS.map(a=>`<button type="button" data-a="anio" data-v="${a}" aria-pressed="${ANIO===a}">${a}</button>`).join("")}</div>`;
function casillas(s){
  const tramos = [["c-disf",s.disf],["c-apro",s.fut],["c-res",s.reserva],["c-pend",s.pend],["c-libre",Math.max(0,s.pedir)]];
  const mitades=[]; tramos.forEach(([c,x])=>{ for(let i=0;i<Math.round(x*2);i++) mitades.push(c); });
  while(mitades.length < s.total*2) mitades.push("c-libre");
  let h=""; for(let i=0;i<mitades.length;i+=2) h+=`<span class="casilla"><i class="${mitades[i]}"></i><i class="${mitades[i+1]||"c-libre"}"></i></span>`;
  return `<div class="casillas" role="img" aria-label="${n(s.total)} días en total: ${n(s.disf)} disfrutados, ${n(s.fut)} aprobados por disfrutar, ${n(s.reserva)} fijos sin asignar, ${n(s.pend)} pendientes y ${n(Math.max(0,s.pedir))} libres">${h}</div>

    <li><span class="muestra c-disf"></span>Disfrutados <b>${n(s.disf)}</b></li>

}
const chipEstado = v => v.origen==="admin" ? `<span class="chip fijo">Fijo</span>` :

const lineaVac = (v, acciones="") => `<li><div class="q"><strong>${rango(v.desde,v.hasta)}</strong>

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("ver"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("ver"),2600); }

function quienFalta(v){
  const otros = new Set();
  S.vac.forEach(o=>{ if(o.emp!==v.emp && o.estado==="aprobada" && o.desde<=v.hasta && o.hasta>=v.desde) otros.add(emp(o.emp).nombre.split(" ")[0]); });
  S.aus.forEach(a=>{ if(a.emp!==v.emp && a.tipo!=="retraso" && a.desde<=v.hasta && finAus(a)>=v.desde) otros.add(emp(a.emp).nombre.split(" ")[0]); });
  return [...otros];
}

const TIPOS = {horas:"Ausencia por horas", baja:"Baja", permiso:"Permiso", falta:"Falta puntual", retraso:"Retraso"};
const minutos = (p,l) => { if(!p||!l) return 0; const [a,b]=p.split(":").map(Number),[c,d]=l.split(":").map(Number); return (c*60+d)-(a*60+b); };
const duracion = m => { const h=Math.floor(m/60), r=m%60; return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`; };
const detHoras = a => `${fc(a.desde)} · de ${a.salida} a ${a.vuelta} · <strong>${duracion(minutos(a.salida,a.vuelta))}</strong>`;
const finAus = a => a.hasta || "9999-12-31";   // baja sin fecha de fin: sigue abierta
function lineaAus(a, conNombre){

      <span class="small">Desde el ${fc(a.desde)} · <strong>sin fecha de fin</strong>${llevan?` · lleva ${dd(llevan)}`:""}</span>${a.motivo?`<span class="muted small">Motivo: ${esc(a.motivo)}</span>`:""}
      ${cerrando?`<form data-f="cerrarBaja" data-id="${a.id}" style="margin-top:10px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><label class="campo" style="width:200px"><span>Último día de baja</span><input type="date" name="fin" min="${a.desde}" value="${S.hoy>=a.desde?S.hoy:a.desde}" required></label><button class="btn chico">Guardar fecha de fin</button><button type="button" class="enlace" data-a="cancelarCierre">Cancelar</button></form>`:""}</div>

    `${rango(a.desde,a.hasta)} · ${dd(dias(a.desde,a.hasta).length)} naturales`;
  return `<li><div class="q"><strong>${conNombre?esc(emp(a.emp).nombre):TIPOS[a.tipo]}</strong><span class="small">${det}</span>${a.motivo?`<span class="muted small">Motivo: ${esc(a.motivo)}</span>`:""}</div>

function trabajando(s){
  // cuenta a los empleados en activo que trabajan ese día; medio día de vacaciones cuenta como medio
  return activos().reduce((t,e)=>{
    if(S.aus.some(a=>a.emp===e.id && ["baja","permiso","falta"].includes(a.tipo) && a.desde<=s && finAus(a)>=s)) return t;
    const v = S.vac.filter(v=>v.emp===e.id && v.estado==="aprobada" && v.desde<=s && v.hasta>=s);
    if(v.some(x=>!x.medio)) return t;
    return t + (v.length ? Math.max(0, 1 - 0.5*v.length) : 1);
  },0);
}
function tCalendario(){
  const hoyMes = S.hoy.slice(0,7);
  const mes = vista.mes || (hoyMes.slice(0,4)===String(ANIO) ? hoyMes : `${ANIO}-01`);
  const [y,m] = mes.split("-").map(Number);
  const ult = new Date(Date.UTC(y,m,0)).getUTCDate();
  const ds = Array.from({length:ult},(_,i)=>`${mes}-${String(i+1).padStart(2,"0")}`);
  const fs = festSet();
  const prev = m===1?null:`${y}-${String(m-1).padStart(2,"0")}`, next = m===12?null:`${y}-${String(m+1).padStart(2,"0")}`;
  const celda = (eid, s) => {
    const w=D(s).getUTCDay(), fin = w===0||w===6||fs.has(s);
    let marcas="";
    S.vac.filter(v=>v.emp===eid && v.estado!=="rechazada" && v.desde<=s && v.hasta>=s).forEach(v=>{
      if(fin) return;
      const c = v.estado==="aprobada"?"ap":"pe";
      marcas += `<i class="${c}${v.medio?(v.franja==="tarde"?" m2":" m1"):""}" title="${v.estado==="aprobada"?"Vacaciones aprobadas":"Pendiente de aprobar"}${v.medio?` · ${tMedio(v).toLowerCase()}`:""}"></i>`;
    });
    S.aus.filter(a=>a.emp===eid && ["baja","permiso","falta"].includes(a.tipo) && a.desde<=s && finAus(a)>=s).forEach(a=>{ if(!fin) marcas += `<i class="au" title="${TIPOS[a.tipo]}"></i>`; });
    return `<td class="d${fin?" fin":""}${s===S.hoy?" hoy":""}">${marcas}</td>`;
  };
  const enMes = S.vac.filter(v=>v.estado==="aprobada" && v.desde<=ds[ult-1] && v.hasta>=ds[0] && emp(v.emp)?.activo!==false).sort((a,b)=>a.desde.localeCompare(b.desde));
  return `<div class="mes">
    <button class="btn sec chico" data-a="mes" data-v="${prev||""}" ${prev?"":"disabled"} aria-label="Mes anterior">‹</button>
    <h2>${ML[m-1]} ${y}</h2>
    <button class="btn sec chico" data-a="mes" data-v="${next||""}" ${next?"":"disabled"} aria-label="Mes siguiente">›</button></div>
  <div class="plan-caja"><table class="plan"><thead><tr><th class="nom">Empleado</th>${ds.map(s=>`<th>${+s.slice(8)}<small>${DS[D(s).getUTCDay()].slice(0,1).toUpperCase()}</small></th>`).join("")}</tr></thead>
  <tbody>${activos().map(e=>`<tr><td class="nom">${esc(e.nombre.split(" ").slice(0,2).join(" "))}</td>${ds.map(s=>celda(e.id,s)).join("")}</tr>`).join("")}</tbody>
  <tfoot><tr><td class="nom">Total trabajando</td>${ds.map(s=>{ const w=D(s).getUTCDay(); if(w===0||w===6||fs.has(s)) return `<td class="fin tot">–</td>`;
    const t=trabajando(s); return `<td class="tot" title="${n(t)} de ${activos().length} trabajando">${n(t)}</td>`; }).join("")}</tr></tfoot></table></div>
  <ul class="leyenda">
    <li><span class="muestra" style="background:var(--pino);border-color:var(--pino)"></span>Vacaciones aprobadas</li>
    <li><span class="muestra" style="background:var(--azafran);border-color:var(--azafran)"></span>Pendiente de aprobar</li>
    <li><span class="muestra" style="background:var(--grana);border-color:var(--grana)"></span>Baja, permiso o falta</li>
    <li><span class="muestra" style="background:#EDEEF4"></span>Fin de semana o festivo</li>
    <li class="muted">Media casilla: medio día (izquierda mañana, derecha tarde)</li>
    <li class="muted">Total trabajando: no cuenta vacaciones aprobadas, bajas, permisos ni faltas; medio día resta 0,5. Las pendientes no restan.</li>
  </ul>
  <section><h2>Vacaciones aprobadas en ${ML[m-1]}</h2>
  <ul class="lista">${enMes.map(v=>`<li><div class="q"><strong>${esc(emp(v.emp).nombre)}</strong><span class="muted small">${rango(v.desde,v.hasta)} · ${v.medio?tMedio(v).toLowerCase():dd(valor(v))}${v.origen==="admin"?" · días fijos":v.origen==="previa"?" · aprobadas antes de la app":""}</span></div></li>`).join("")||`<li class="vacio">Nadie tiene vacaciones aprobadas este mes.</li>`}</ul></section>`;
}

/* ============ Conexión con la hoja ============ */
async function api(accion, datos={}){
  document.body.classList.add("cargando");
  try{
    let r;
    try{
      r = await fetch(API_URL, {method:"POST", body: JSON.stringify({accion, token: vista.sesion && vista.sesion.token, ...datos})});
    }catch(e){ throw new Error("No hay conexión. Comprueba internet y vuelve a probar."); }
    let j; try{ j = await r.json(); }catch(e){ throw new Error("El servidor no ha respondido bien. Vuelve a probar en un momento."); }
    if(!j.ok){
      if(j.error==="SESION"){ cerrarSesion(); throw new Error(j.mensaje); }
      throw new Error(j.mensaje || j.error || "No se ha podido guardar.");
    }
    return j;
  } finally { document.body.classList.remove("cargando"); }
}
async function recargar(){
  const j = await api("estado");
  const c = j.cfg || {};
  ANIO_INICIO = c.ANIO_INICIO ?? ANIO_INICIO; DIAS_ANUALES = c.DIAS_ANUALES ?? DIAS_ANUALES; DIAS_FIJOS = c.DIAS_FIJOS ?? DIAS_FIJOS; PIN_PROV = c.PIN_PROV ?? PIN_PROV;
  const titulo = t => String(t||"").toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,l)=>a+l.toUpperCase());
  (j.empleados||[]).forEach(e=>{ e.nombre = titulo(e.nombre); });
  S = {hoy:j.hoy, festivos:j.festivos||[], empleados:j.empleados||[], inicial:j.inicial||{}, vac:j.vac||[], aus:j.aus||[], extras:j.extras||[]};
  const ultimo = Math.max(+S.hoy.slice(0,4)+1, ANIO_INICIO);
  ANIOS = []; for(let a=ANIO_INICIO; a<=ultimo; a++) ANIOS.push(a);
  if(vista.sesion && vista.sesion.rol==="emp"){ vista.sesion.id = S.empleados[0]?.id; guardarSesion(); }
}
function guardarSesion(){ try{ vista.sesion ? localStorage.setItem(CLAVE_SESION, JSON.stringify(vista.sesion)) : localStorage.removeItem(CLAVE_SESION); }catch(e){} }
function cerrarSesion(){ vista={...vista, sesion:null, emp:null, sim:{}, rechazando:null, anio:null, confirmSalida:null, cerrando:null}; S=null; guardarSesion(); render(); }
// Hace una acción en la hoja, vuelve a leer los datos y avisa
async function hacer(accion, datos, mensaje, despues){
  try{
    await api(accion, datos);
    if(despues) despues();
    await recargar(); render(); if(mensaje) toast(mensaje);
    return true;
  }catch(e){ if(!S) errorCarga(e); else { if(e.message) toast(e.message); render(); } return false; }
}

function errorCarga(e){
  if(!vista.sesion){ render(); if(e.message) toast(e.message); return; }
  document.getElementById("app").innerHTML=`<p class="espera">${esc(e.message||"No se han podido cargar los datos.")}<br><br><button class="btn sec" data-a="recargar">Volver a probar</button></p>`;
}

/* ============ Render ============ */
function render(){
  const app=document.getElementById("app"), ses=document.getElementById("sesion");
  const s=vista.sesion;
  ses.innerHTML = s ? `<button type="button" data-a="salir">Salir</button>` : "";
  if(s && !S && !s.cambiarPin){ app.innerHTML = `<p class="espera">Cargando…</p>`; return; }
  if(S){ ANIO = vista.anio || Math.min(Math.max(+S.hoy.slice(0,4), ANIOS[0]), ANIOS[ANIOS.length-1]); }
  app.innerHTML = !s ? vAcceso() : s.cambiarPin ? vCambiarPin() : s.rol==="admin" ? vAdmin() : vEmpleado(s.id);
}
function rerenderConFoco(nombre){
  render();
  const el=document.querySelector(`[name="${nombre}"]`); if(el) el.focus();
}

/* ============ Eventos ============ */
document.addEventListener("click", ev=>{
  const b = ev.target.closest("[data-a]"); if(!b || b.tagName==="SELECT") return;
  const a=b.dataset.a, id=b.dataset.id;
  const v = id && S && S.vac.find(x=>x.id===id);
  const nom = eid => (emp(eid)?.nombre||"").split(" ")[0];
  switch(a){
    case "modo": vista.modo=b.dataset.v; render(); break;
    case "salir": document.getElementById("toast").classList.remove("ver"); cerrarSesion(); break;
    case "resetPin": hacer("resetPin",{emp:id},`PIN restablecido a ${PIN_PROV}`); break;
    case "anio": vista.anio=+b.dataset.v; vista.mes=null; vista.sim={}; render(); break;
    case "pedirSalida": vista.confirmSalida=id; render(); break;
    case "cancelarSalida": vista.confirmSalida=null; render(); break;
    case "readmitir": hacer("readmitir",{emp:id},`${nom(id)} vuelve a estar en la plantilla`); break;
    case "pmedio": vista.pmedio=b.dataset.v||null; vista.sim={pdesde:vista.sim.pdesde}; render(); break;
    case "mes": vista.mes=b.dataset.v; render(); break;
    case "cerrarBaja": vista.cerrando=id; render(); break;
    case "cancelarCierre": vista.cerrando=null; render(); break;
    case "franja": vista.franja=b.dataset.v; render(); break;
    case "medio": vista.medio=b.dataset.v==="1"; vista.sim={desde:vista.sim.desde}; render(); break;
    case "anular": hacer("anular",{id},"Solicitud anulada"); break;
    case "tab": vista.tab=b.dataset.v; vista.emp=null; vista.sim={}; render(); if(vista.sesion?.rol==="admin") hacer("estado"); break;
    case "aprobar": hacer("aprobar",{id},`Aprobada: ${nom(v.emp)}, ${rango(v.desde,v.hasta)}`); break;
    case "rech": vista.rechazando=id; render(); document.querySelector('[data-f=rechazar] input').focus(); break;
    case "cancelarRech": vista.rechazando=null; render(); break;
    case "ficha": vista.emp=id; vista.sim={}; render(); window.scrollTo(0,0); break;
    case "volver": vista.emp=null; vista.sim={}; render(); break;
    case "quitarVac": hacer("quitarVac",{id},"Días quitados"); break;
    case "quitarExtra": hacer("quitarExtra",{id},"Días extra quitados"); break;
    case "tipoAus": vista.tipoAus=b.dataset.v; render(); break;
    case "quitarAus": vista.sesion.rol==="admin" ? hacer("quitarAus",{id},"Registro borrado") : hacer("anularAviso",{id},"Aviso anulado"); break;
    case "visto": hacer("visto",{id},"Marcado como visto"); break;
    case "quitarFest": hacer("quitarFestivo",{fecha:b.dataset.f},"Festivo quitado"); break;
    case "recargar": hacer("estado",{},"Datos actualizados"); break;
  }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target.matches("tr[data-a=ficha]")) ev.target.click(); });
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.matches("[data-sim]")){ vista.sim[t.name]=t.value; if(t.name==="desde"&&vista.sim.hasta&&vista.sim.hasta<t.value) vista.sim.hasta=t.value; if(t.name==="fdesde"&&vista.sim.fhasta&&vista.sim.fhasta<t.value) vista.sim.fhasta=t.value; if(t.name==="pdesde"&&vista.sim.phasta&&vista.sim.phasta<t.value) vista.sim.phasta=t.value; rerenderConFoco(t.name); }
  if(t.name==="abierta"){ const h=t.form.querySelector("[name=hasta]"); h.disabled=t.checked; h.required=!t.checked; if(t.checked) h.value=""; }
  if(t.matches("[data-a=filtroAus]")){ vista.filtroAus=t.value; render(); }
});

document.addEventListener("submit", async ev=>{
  ev.preventDefault();
  const f=ev.target, d=Object.fromEntries(new FormData(f)), tipo=f.dataset.f;
  const err=(sel,t)=>{ const el=document.getElementById(sel); if(el) el.innerHTML=`<div class="aviso mal">${esc(t)}</div>`; };
  if(tipo==="entrar"){
    const admin = vista.modo==="admin";
    if(!admin && !dniValido(d.u)){ err("errAcceso","Ese DNI o NIE no es válido. Revisa los números y la letra."); return; }
    try{
      const j = await api("entrar",{modo:admin?"admin":"emp", usuario:d.u, pin:d.p});
      vista.sesion = {rol:j.rol, token:j.token, cambiarPin:!!j.cambiarPin};
      if(j.rol==="emp"){ vista.sesion.id = null; }
      vista.tab="solicitudes"; vista.sim={}; vista.anio=null;
      guardarSesion();
      if(!j.cambiarPin){ render(); await recargar(); }
      render();
    }catch(e){ if(document.getElementById("errAcceso")) err("errAcceso", e.message); else errorCarga(e); }
    return;
  }
  if(tipo==="nuevoPin"){
    if(!/^\d{4,8}$/.test(d.p1)){ err("errPin","El PIN tiene que tener entre 4 y 8 cifras, solo números."); return; }
    if(d.p1===PIN_PROV){ err("errPin",`No puedes usar el PIN provisional ${PIN_PROV}. Elige otro.`); return; }
    if(d.p1!==d.p2){ err("errPin","Los dos PIN no coinciden. Escríbelos otra vez."); return; }
    try{
      await api("cambiarPin",{pin:d.p1});
      vista.sesion.cambiarPin=false; guardarSesion(); render(); await recargar(); render();
      toast("PIN guardado. A partir de ahora entra con él.");
    }catch(e){ if(document.getElementById("errPin")) err("errPin", e.message); else errorCarga(e); }
    return;
  }
  const s = vista.sesion; if(!s || !S) return;
  if(tipo==="salida"){ const id=f.dataset.id, nombre=(emp(id)?.nombre||"").split(" ")[0]; vista.confirmSalida=null; vista.emp=null; hacer("salida",{emp:id, fecha:d.fecha},`${nombre} ya no está en la plantilla`); return; }
  if(tipo==="previa"){
    const id=f.dataset.id, medio=!!vista.pmedio, desde=d.pdesde, hasta=medio?d.pdesde:(d.phasta||d.pdesde);
    const c=explicar(desde,hasta,medio,vista.pmedio,ANIO>ANIO_INICIO); if(c.error||!c.dias) return;
    if(await hacer("vacacionesAprobadas",{emp:id, desde, hasta, medio, franja:vista.pmedio, origen:"previa", anio:ANIO},"Vacaciones apuntadas como aprobadas")) { vista.sim={}; render(); }
    return;
  }
  if(tipo==="cerrarBaja"){ vista.cerrando=null; hacer("cerrarBaja",{id:f.dataset.id, fin:d.fin},`Baja cerrada: último día el ${fl(d.fin)}`); return; }
  if(tipo==="inicialUno"){ hacer("inicial",{emp:f.dataset.id, dias:d.dias},"Días guardados"); return; }
  if(tipo==="pedir"){
    const desde=d.desde, hasta=vista.medio?d.desde:(d.hasta||d.desde);
    const c=explicar(desde,hasta,vista.medio); if(c.error||!c.dias) return;
    if(solapa(s.id,desde,hasta,null,vista.medio?vista.franja:null)){ toast("Ya tienes vacaciones o una solicitud en esas fechas"); return; }
    if(await hacer("pedir",{desde, hasta, medio:vista.medio, franja:vista.franja},"Solicitud enviada al administrador")) { vista.sim={}; render(); }
    return;
  }
  if(tipo==="rechazar"){ vista.rechazando=null; hacer("rechazar",{id:f.dataset.id, motivo:d.m},"Solicitud rechazada"); return; }
  if(tipo==="fijo"){
    const id=f.dataset.id, desde=d.fdesde, hasta=d.fhasta||d.fdesde, c=explicar(desde,hasta,false); if(c.error||!c.dias) return;
    if(await hacer("vacacionesAprobadas",{emp:id, desde, hasta, medio:false, origen:"admin"},"Días fijos asignados")) { vista.sim={}; render(); }
    return;
  }
  if(tipo==="extra"){ hacer("extra",{emp:f.dataset.id, anio:ANIO, dias:d.dias, motivo:d.motivo},"Días extra añadidos"); return; }
  if(tipo==="nuevoEmp"){
    const dni=dniValido(d.dni); if(!dni){ err("errEmp","Ese DNI o NIE no es válido."); return; }
    if(S.empleados.some(e=>e.dni===dni)){ err("errEmp","Ya hay un empleado con ese DNI."); return; }
    hacer("nuevoEmp",{nombre:d.nombre, dni},`Empleado añadido. Entrará con el PIN ${PIN_PROV}`); return;
  }
  if(tipo==="avisoHoras" || (tipo==="aus" && vista.tipoAus==="horas")){
    const esEmp = tipo==="avisoHoras", caja = esEmp?"errHoras":"errAus";
    if(minutos(d.salida,d.vuelta)<=0){ err(caja,"La hora de vuelta tiene que ser posterior a la de salida."); return; }
    if(esEmp && d.desde<S.hoy){ err(caja,"Ese día ya ha pasado. Elige hoy o un día posterior."); return; }
    const datos={desde:d.desde, salida:d.salida, vuelta:d.vuelta, categoria:d.categoria, motivo:d.motivo||""};
    esEmp ? hacer("aviso",datos,"Aviso enviado al administrador") : hacer("ausencia",{...datos, tipo:"horas", emp:d.emp},"Registro guardado: ausencia por horas");
    return;
  }
  if(tipo==="aus"){
    const t=vista.tipoAus, abierta = t==="baja" && d.abierta==="on";
    const hasta = abierta ? "" : (t==="baja"||t==="permiso")?d.hasta:d.desde;
    if(hasta && hasta<d.desde){ err("errAus","La fecha final es anterior a la inicial."); return; }
    if(t==="retraso" && minutos(d.prevista,d.llegada)<=0){ err("errAus","La hora de llegada tiene que ser posterior a la de entrada."); return; }
    hacer("ausencia",{emp:d.emp, tipo:t, desde:d.desde, hasta, motivo:d.motivo||"", prevista:d.prevista, llegada:d.llegada},abierta?"Baja guardada sin fecha de fin":`Registro guardado: ${TIPOS[t].toLowerCase()}`);
    return;
  }
  if(tipo==="fest"){
    if(S.festivos.some(x=>x.fecha===d.fecha)){ toast("Ese día ya es festivo"); return; }
    hacer("festivo",{fecha:d.fecha, nombre:d.nombre, ambito:d.ambito},"Festivo añadido"); return;
  }
});

/* ============ Arranque ============ */
(async function(){
  try{ const t=localStorage.getItem(CLAVE_SESION); if(t) vista.sesion=JSON.parse(t); }catch(e){}
  render();
  if(vista.sesion && !vista.sesion.cambiarPin){
    try{ await recargar(); render(); }
    catch(e){ errorCarga(e); }
  }
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
})();
</script>
